<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dark Squircle Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a26"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>

    <!-- Fiery Chili Gradient -->
    <linearGradient id="pepperGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ff4438"/>
      <stop offset="35%" stop-color="#ff172b"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Gloss Sheen Gradient -->
    <linearGradient id="pepperGloss" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffb3b3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff172b" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Acid Stem & Leaf Gradient -->
    <linearGradient id="stemLime" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#d7f36b"/>
    </linearGradient>

    <!-- Drop Glows -->
    <filter id="chiliGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff172b" flood-opacity="0.8"/>
    </filter>
    <filter id="bracketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#ffffff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bgGrad)" stroke="#ff3b30" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="5" y="5" width="90" height="90" rx="21" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Left Code Angle Bracket: < -->
  <path d="M 36 36 L 19 50 L 36 64" 
        stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#bracketGlow)"/>

  <!-- Right Code Angle Bracket: > -->
  <path d="M 64 36 L 81 50 L 64 64" 
        stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#bracketGlow)"/>

  <!-- Ambient Chili Glow Backdrop -->
  <circle cx="50" cy="53" r="22" fill="#ff172b" opacity="0.18"/>

  <!-- Fiery Curved Chili Pepper (acting as the code slash / ) -->
  <path d="M 52 34
           C 56 35, 60 41, 60 49
           C 59 60, 52 70, 34 75
           C 30 76, 29 74, 31 72
           C 41 68, 47 61, 48 50
           C 49 42, 47 37, 46 34
           Z"
        fill="url(#pepperGrad)"
        filter="url(#chiliGlow)"/>

  <!-- Chili White Gloss Highlight Streak -->
  <path d="M 49 37
           C 51 42, 50 50, 46 59
           C 44 63, 40 67, 34 71"
        stroke="url(#pepperGloss)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Green Calyx Crown atop Pepper -->
  <path d="M 46 35
           C 48 32, 53 32, 56 34
           C 54 36, 49 37, 46 35
           Z"
        fill="#2d4a0e"/>

  <!-- Neon Green Stem Curving Up & Right -->
  <path d="M 50 33
           C 52 27, 56 22, 61 19
           C 59 23, 55 28, 53 33
           Z"
        fill="url(#stemLime)"/>

  <!-- Cute Stem Leaf Pointing Right -->
  <path d="M 56 25
           C 61 24, 66 26, 68 30
           C 63 31, 59 29, 56 25
           Z"
        fill="url(#stemLime)"/>
</svg>
